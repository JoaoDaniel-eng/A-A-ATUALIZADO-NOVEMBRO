services:
  - type: web
    name: acai-da-roca
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DEV_EMAIL
        sync: false
      - key: DEV_PASSWORD
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
